# NigerianBot — Phase 1 stack (Discord bot only).
#
# The image is built by GitHub Actions and published to GHCR, so Portainer just
# PULLS it — your server never compiles anything. Deploy as a Stack in Portainer
# (Stacks → Add stack → Repository), set DISCORD_TOKEN (and optionally
# DISCORD_GUILD_ID) under "Environment variables", and deploy.
#
# Later phases add postgres, redis, api, scheduler, worker, and the dashboard.

services:
  bot:
    image: ghcr.io/smartcile/nigerianbot-bot:latest
    container_name: nigerian-bot
    restart: unless-stopped
    pull_policy: always
    environment:
      # Required: your Discord bot token.
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in Portainer env}
      # Optional but recommended for testing: your server (guild) id makes slash
      # commands register instantly instead of taking up to ~1 hour globally.
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Log verbosity: info | debug | trace
      RUST_LOG: ${RUST_LOG:-info}
