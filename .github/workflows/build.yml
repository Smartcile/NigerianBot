name: Build & push image

# Builds the single all-in-one image on GitHub's runners and pushes it to the
# GitHub Container Registry (GHCR). Portainer then just pulls the prebuilt image,
# so the server never compiles Rust.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "bot/**"
      - "api/**"
      - "common/**"
      - "scheduler/**"
      - "worker/**"
      - "telegram/**"
      - "dashboard/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase image path.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nigerianbot" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          # Registry-based layer cache on GHCR (reliable, unlike type=gha which
          # 504'd). Combined with cargo-chef in the Dockerfile, unchanged
          # dependencies are reused so only changed code recompiles.
          cache-from: type=registry,ref=${{ steps.img.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.name }}:buildcache,mode=max
