[package]
name = "bot"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nigerian-bot"
path = "src/main.rs"

[dependencies]
common.workspace = true
serenity.workspace = true
songbird.workspace = true
# songbird 0.6 pulls in symphonia but enables NO codecs by default; declaring it
# here with codecs on turns them on (via cargo feature unification) so songbird
# can actually decode audio — including the PCM decoder that the ffmpeg-piped
# local-file path relies on, and the formats yt-dlp serves for URLs.
symphonia = { version = "0.5", features = ["all"] }
tokio.workspace = true
sqlx.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
