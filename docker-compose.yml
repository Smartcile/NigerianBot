# NigerianBot — all-in-one stack (PostgreSQL + one app container).
#
# The `app` image runs every surface in a single process: the Discord bot, the
# API + dashboard, the download worker, and the Telegram bot. Deploy as a Stack
# in Portainer (Stacks → Add stack → Repository) and set these under
# "Environment variables":
#   DISCORD_TOKEN      (required)  your Discord bot token
#   DISCORD_GUILD_ID   (optional)  your server id for instant command registration
#   POSTGRES_PASSWORD  (required)  the database password
#   API_KEY            (required)  secret to log into the API/dashboard
#   JWT_SECRET         (required)  secret used to sign API tokens
#   TELEGRAM_BOT_TOKEN (optional)  enables the Telegram surface + notifications
#   SONARR_*/RADARR_*  (optional)  media panel + /sonarr, /radarr
#   MUSIC_HOST_PATH    (optional)  path to your music folder on the server
#
# Images are built by GitHub Actions and published to GHCR, so Portainer just
# PULLS them (never use compose `build:` in Portainer).

services:
  postgres:
    image: postgres:16-alpine
    container_name: nigerian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nigerian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Portainer env}
      POSTGRES_DB: ${POSTGRES_DB:-nigerian_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nigerian} -d ${POSTGRES_DB:-nigerian_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/smartcile/nigerianbot:latest
    container_name: nigerianbot
    restart: unless-stopped
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # API_PORT controls the port everywhere (host + container). Default 8000.
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      # ── Discord ────────────────────────────────────────────────────────────
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in Portainer env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Optional extra bot tokens for the voice pool (simultaneous channels).
      DISCORD_TOKEN_2: ${DISCORD_TOKEN_2:-}
      DISCORD_TOKEN_3: ${DISCORD_TOKEN_3:-}
      DISCORD_TOKEN_4: ${DISCORD_TOKEN_4:-}
      DISCORD_TOKEN_5: ${DISCORD_TOKEN_5:-}
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
      # ── Database ───────────────────────────────────────────────────────────
      DATABASE_URL: postgres://${POSTGRES_USER:-nigerian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nigerian_bot}
      # ── API / dashboard ────────────────────────────────────────────────────
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      API_KEY: ${API_KEY:?set API_KEY in Portainer env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Portainer env}
      DASHBOARD_DIR: /app/static
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # ── Music ──────────────────────────────────────────────────────────────
      MUSIC_MOUNT_PATH: /music
      # ── Downloads / worker ─────────────────────────────────────────────────
      DOWNLOADS_PATH: /downloads
      DISCORD_NOTIFY_WEBHOOK: ${DISCORD_NOTIFY_WEBHOOK:-}
      WORKER_POLL_INTERVAL_SECS: ${WORKER_POLL_INTERVAL_SECS:-30}
      # ── Media (Sonarr / Radarr) ────────────────────────────────────────────
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      # ── Telegram ───────────────────────────────────────────────────────────
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      # ── Logging ────────────────────────────────────────────────────────────
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Your music folder, read-only. Set MUSIC_HOST_PATH to your music drive.
      - ${MUSIC_HOST_PATH:-./music}:/music:ro
      # Finished downloads (also served by the API at /media).
      - downloads:/downloads

volumes:
  pgdata:
  downloads:
