[workspace]
resolver = "2"
members = ["common", "app", "bot", "api", "scheduler", "worker", "telegram"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"

# Centralized dependency versions so every service stays in lockstep.
# Reference from a member crate with e.g. `tokio.workspace = true`.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "chrono", "uuid"] }
# Pinned to 0.12 to match songbird 0.6's reqwest (the YoutubeDl source takes a
# reqwest::Client, so the versions must agree).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Discord bot
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "voice", "cache"] }
# songbird 0.6 implements Discord's DAVE (E2EE) protocol, which Discord made
# mandatory for all non-stage voice connections on 2026-03-02. Earlier versions
# get rejected with voice close code 4017.
songbird = { version = "0.6", features = ["builtin-queue"] }

# API backend
actix-web = "4"
actix-rt = "2"
actix-files = "0.6"
jsonwebtoken = "9"
bcrypt = "0.15"
tracing-actix-web = "0.7"

# Scheduler
tokio-cron-scheduler = "0.10"

# Telegram surface. rustls (not native-tls) so the image needs no OpenSSL.
teloxide = { version = "0.13", default-features = false, features = ["rustls", "macros", "ctrlc_handler"] }

# Shared crate
common = { path = "common" }

# Service crates, reused as libraries by the all-in-one `app` binary.
bot = { path = "bot" }
api = { path = "api" }
worker = { path = "worker" }
telegram = { path = "telegram" }
