<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NigerianBot Dashboard</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #181b24; --panel2: #20242f; --line: #2a2f3a;
      --text: #e7e9ee; --muted: #9aa3b2; --accent: #5865f2; --good: #3ba55d; --bad: #ed4245;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    a { color: var(--accent); }
    .hidden { display: none !important; }

    /* Login */
    #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    .card h1 { margin: 0 0 4px; font-size: 22px; }
    .card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--panel2); color: var(--text); font-size: 15px; margin-bottom: 12px;
    }
    button {
      width: 100%; padding: 12px 14px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 8px; }

    /* App */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    header h1 { margin: 0; font-size: 18px; }
    header button { width: auto; padding: 8px 14px; background: var(--panel2); border: 1px solid var(--line); }
    main { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; }
    .stat .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
    .section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
    .section h2 { margin: 0 0 14px; font-size: 15px; color: var(--muted); font-weight: 600; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .bar-row .name { width: 110px; font-size: 14px; }
    .bar { flex: 1; height: 10px; background: var(--panel2); border-radius: 6px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    .bar-row .n { width: 40px; text-align: right; color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; }
    .pill.good { background: rgba(59,165,93,.15); color: var(--good); }
    .pill.bad { background: rgba(237,66,69,.15); color: var(--bad); }
    code { background: var(--panel2); padding: 2px 7px; border-radius: 6px; }
    .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login">
    <form class="card" onsubmit="return doLogin(event)">
      <h1>🎵 NigerianBot</h1>
      <p>Sign in with your API key to view the dashboard.</p>
      <input id="apikey" type="password" placeholder="API key" autocomplete="current-password" />
      <button type="submit">Sign in</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <header>
      <h1>🎵 NigerianBot Dashboard</h1>
      <button onclick="logout()">Sign out</button>
    </header>
    <main>
      <div class="grid">
        <div class="stat"><div class="label">Total commands</div><div class="value" id="sTotal">—</div></div>
        <div class="stat"><div class="label">Last 24 hours</div><div class="value" id="s24">—</div></div>
        <div class="stat"><div class="label">Database</div><div class="value" id="sDb">—</div></div>
      </div>

      <div class="section">
        <h2>TOP COMMANDS</h2>
        <div id="topCommands"></div>
      </div>

      <div class="section">
        <h2>RECENT ACTIVITY</h2>
        <table>
          <thead><tr><th>When</th><th>User</th><th>Command</th></tr></thead>
          <tbody id="logRows"></tbody>
        </table>
      </div>
      <div class="foot">Auto-refreshes every 10s · <span id="updated"></span></div>
    </main>
  </div>

  <script>
    const KEY = 'nb_token';
    let token = localStorage.getItem(KEY);
    let timer = null;

    function show(id) {
      document.getElementById('login').classList.toggle('hidden', id !== 'login');
      document.getElementById('app').classList.toggle('hidden', id !== 'app');
    }

    async function doLogin(e) {
      e.preventDefault();
      const err = document.getElementById('loginErr');
      err.textContent = '';
      const apiKey = document.getElementById('apikey').value.trim();
      if (!apiKey) return false;
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ api_key: apiKey })
        });
        if (!r.ok) { err.textContent = 'Invalid API key.'; return false; }
        const data = await r.json();
        token = data.token;
        localStorage.setItem(KEY, token);
        start();
      } catch (_) { err.textContent = 'Could not reach the server.'; }
      return false;
    }

    async function api(path) {
      const r = await fetch(path, { headers: { 'Authorization': 'Bearer ' + token } });
      if (r.status === 401) { logout(); throw new Error('unauthorized'); }
      return r.json();
    }

    function esc(s) { return String(s ?? '').replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c])); }

    async function refresh() {
      try {
        const [status, stats, logs] = await Promise.all([
          api('/api/bot/status'), api('/api/stats'), api('/api/bot/logs?limit=25')
        ]);

        document.getElementById('sTotal').textContent = stats.total ?? '—';
        document.getElementById('s24').textContent = stats.last_24h ?? '—';
        const db = (status.database === 'connected');
        document.getElementById('sDb').innerHTML =
          '<span class="pill ' + (db ? 'good' : 'bad') + '">' + (db ? 'Connected' : 'Down') + '</span>';

        const top = stats.top || [];
        const max = Math.max(1, ...top.map(t => t.count));
        document.getElementById('topCommands').innerHTML = top.length ? top.map(t =>
          '<div class="bar-row"><div class="name"><code>/' + esc(t.command) + '</code></div>' +
          '<div class="bar"><span style="width:' + (100 * t.count / max) + '%"></span></div>' +
          '<div class="n">' + t.count + '</div></div>'
        ).join('') : '<div style="color:var(--muted)">No commands yet.</div>';

        const rows = (logs.logs || []).map(l =>
          '<tr><td>' + new Date(l.created_at).toLocaleString() + '</td>' +
          '<td>' + esc(l.user_name || l.user_id) + '</td>' +
          '<td><code>/' + esc(l.command) + '</code></td></tr>'
        ).join('');
        document.getElementById('logRows').innerHTML = rows || '<tr><td colspan="3" style="color:var(--muted)">No activity yet.</td></tr>';

        document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
      } catch (_) { /* logout handled in api() */ }
    }

    function start() {
      show('app');
      refresh();
      clearInterval(timer);
      timer = setInterval(refresh, 10000);
    }

    function logout() {
      localStorage.removeItem(KEY);
      token = null;
      clearInterval(timer);
      show('login');
    }

    if (token) start(); else show('login');
  </script>
</body>
</html>
